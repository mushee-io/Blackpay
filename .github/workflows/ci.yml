name: Blackpay CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type and privacy checks
        run: npm run check
      - name: Build application
        run: npm run build

  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Compact devtools
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.2/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Select ledger-8 Compact toolchain
        shell: bash
        run: |
          compact update 0.31
          compact --version
      - name: Compile Blackpay contract
        run: compact compile contract/payroll.compact contract/build
      - name: Assert generated contract assets
        shell: bash
        run: |
          test -d contract/build
          test -n "$(find contract/build -type f -print -quit)"
          find contract/build -maxdepth 3 -type f -print | sort
      - name: Upload compiled Compact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blackpay-compact-0.31.1
          path: contract/build
          if-no-files-found: error
          retention-days: 14
