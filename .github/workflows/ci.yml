name: Blackpay CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type and privacy checks
        run: npm run check

  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Compact devtools
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.2/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Select ledger-8 Compact toolchain
        shell: bash
        run: |
          compact update 0.31
          compact --version
      - name: Compile Blackpay contract
        run: compact compile contract/payroll.compact contract/build
      - name: Assert generated contract assets
        shell: bash
        run: |
          test -d contract/build
          test -s contract/build/contract/index.js
          test -s contract/build/contract/index.d.ts
          test -n "$(find contract/build -type f -print -quit)"
          find contract/build -maxdepth 3 -type f -print | sort
      - name: Upload compiled Compact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blackpay-compact-0.31.1
          path: contract/build
          if-no-files-found: error
          retention-days: 14

  live-assets:
    needs: [app, compact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Download exact compiled contract
        uses: actions/download-artifact@v4
        with:
          name: blackpay-compact-0.31.1
          path: contract/build
      - name: Prepare generated runtime and proving assets
        run: npm run compact:assets
      - name: Assert hosted Preview assets
        shell: bash
        run: |
          test -s src/generated/blackpay/index.js
          test -s src/generated/blackpay/index.d.ts
          test -s public/compact/contract-info.json
          test "$(find public/keys -type f | wc -l)" -eq 26
          test "$(find public/zkir -type f | wc -l)" -eq 26
      - name: Build production app with generated Compact runtime
        run: npm run build:next
      - name: Upload hosted runtime assets
        uses: actions/upload-artifact@v4
        with:
          name: blackpay-preview-browser-assets
          path: |
            public/compact
            public/keys
            public/zkir
          if-no-files-found: error
          retention-days: 14
