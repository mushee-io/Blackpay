name: Blackpay CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: blackpay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type and privacy checks
        run: npm run check

  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Compact devtools
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.2/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Select ledger-8 Compact toolchain
        shell: bash
        run: |
          compact update 0.31
          compact --version
      - name: Compile payroll and invoice contracts
        run: bash scripts/compile-compact.sh
      - name: Assert generated contract assets
        shell: bash
        run: |
          test -s contract/build/contract/index.js
          test -s contract/build/contract/index.d.ts
          test -s contract/invoice-build/contract/index.js
          test -s contract/invoice-build/contract/index.d.ts
          test -n "$(find contract/build -type f -print -quit)"
          test -n "$(find contract/invoice-build -type f -print -quit)"
      - name: Upload compiled Compact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blackpay-compact-0.31.1
          path: |
            contract/build
            contract/invoice-build
          if-no-files-found: error
          retention-days: 14

  live-assets:
    needs: [app, compact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Download exact compiled contracts
        uses: actions/download-artifact@v4
        with:
          name: blackpay-compact-0.31.1
          path: contract
      - name: Normalize downloaded artifact paths
        shell: bash
        run: |
          if [ -d contract/contract/build ]; then mv contract/contract/build contract/build; fi
          if [ -d contract/contract/invoice-build ]; then mv contract/contract/invoice-build contract/invoice-build; fi
          test -s contract/build/contract/index.js
          test -s contract/invoice-build/contract/index.js
      - name: Prepare generated runtime and proving assets
        run: npm run compact:assets
      - name: Assert hosted Preview assets
        shell: bash
        run: |
          test -s src/generated/blackpay/index.js
          test -s src/generated/blackpay/index.d.ts
          test -s src/generated/invoice/index.js
          test -s src/generated/invoice/index.d.ts
          test -s public/compact/contract-info.json
          test -s public/invoice/compact/contract-info.json
          test "$(find public/keys -type f | wc -l)" -eq 26
          test "$(find public/zkir -type f | wc -l)" -eq 26
          test "$(find public/invoice/keys -type f | wc -l)" -eq 8
          test "$(find public/invoice/zkir -type f | wc -l)" -eq 8
      - name: Build production app with generated Compact runtimes
        run: npm run build:next
      - name: Upload hosted runtime assets
        uses: actions/upload-artifact@v4
        with:
          name: blackpay-preview-browser-assets
          path: |
            public/compact
            public/keys
            public/zkir
            public/invoice
          if-no-files-found: error
          retention-days: 14
